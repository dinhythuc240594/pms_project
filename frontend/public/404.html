<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#122b44">
  <title>LOHA · Không tìm thấy trang</title>
  <style>
    :root { --ink: #122b44; --muted: #56677a; --blue: #086ab4; --line: #dce4ec; --soft: #f3f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--soft); color: var(--ink); font-family: Inter, 'Be Vietnam Pro', 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
    main { display: flex; flex-direction: column; gap: 24px; min-height: 100vh; min-height: 100svh; padding: clamp(20px, 4vw, 48px); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .brand { display: inline-flex; align-items: center; gap: 12px; color: var(--ink); text-decoration: none; font-size: 25px; font-weight: 800; line-height: 1.15; letter-spacing: -.8px; }
    .brand small { display: block; margin-top: 5px; color: var(--muted); font-size: 8px; font-weight: 600; letter-spacing: 1.4px; }
    .brand-mark { position: relative; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px 10px 2px 10px; background: #0c7cd5; color: white; font-size: 28px; font-weight: 700; }
    .brand-mark span { position: absolute; right: 7px; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: #def09f; }
    .caption { color: var(--muted); font-size: 9px; font-weight: 600; letter-spacing: 1.4px; }
    .content { display: flex; flex: 1; flex-direction: column; align-items: center; justify-content: center; gap: 16px; width: min(640px, 100%); margin: 12px auto; text-align: center; }
    .visual { display: flex; align-items: center; justify-content: center; gap: 20px; padding: 20px 0; }
    .visual > span { font-size: clamp(72px, 13vw, 128px); font-weight: 700; letter-spacing: -.06em; line-height: 1; }
    .icon { display: grid; place-items: center; width: 72px; height: 72px; border: 1px solid var(--line); border-radius: 12px; background: white; color: var(--blue); }
    .eyebrow { margin: 0; color: var(--blue); font-size: 10px; font-weight: 650; letter-spacing: 1.4px; }
    h1 { margin: 0; font-size: clamp(24px, 3vw, 34px); font-weight: 650; letter-spacing: -.6px; line-height: 1.3; overflow-wrap: anywhere; }
    .description { max-width: 500px; margin: 0; color: var(--muted); font-size: 14px; line-height: 1.8; }
    .actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
    .button { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 11px 18px; border: 1px solid var(--line); border-radius: 6px; background: white; color: var(--ink); font: inherit; font-size: 13px; font-weight: 600; text-decoration: none; cursor: pointer; }
    .primary { border-color: var(--blue); background: var(--blue); color: white; }
    .button:hover { border-color: var(--blue); }
    .primary:hover { background: #07578f; }
    :is(a, button):focus-visible { outline: 3px solid var(--blue); outline-offset: 4px; }
    footer { color: var(--muted); font-size: 11px; line-height: 1.6; text-align: center; }
    @media (max-width: 600px) { .caption { display: none; } .visual { gap: 16px; padding: 12px 0; } .icon { width: 56px; height: 56px; } .actions, .button { width: 100%; } }
  </style>
</head>
<body>
  <main aria-labelledby="error-title">
    <header>
      <a class="brand" href="/" aria-label="LOHA — Trang chủ"><span class="brand-mark" aria-hidden="true">L<span></span></span><span>LOHA<small>PMS SYSTEM</small></span></a>
      <span class="caption">KHÔNG GIAN HIẾU KHÁCH</span>
    </header>
    <section class="content">
      <div class="visual" aria-hidden="true"><span>404</span><div class="icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M9.5 13a2.5 2.5 0 1 1 4.1 1.9c-1.1.5-1.6 1-1.6 2.1M12 19h.01"/></svg></div></div>
      <p class="eyebrow">LOHA PMS · 404</p>
      <h1 id="error-title">Không tìm thấy trang</h1>
      <p class="description">Đường dẫn này không tồn tại hoặc đã được thay đổi. Bạn có thể quay lại trang trước hoặc về trang chủ LOHA.</p>
      <div class="actions">
        <a class="button primary" href="/">Về trang chủ</a>
        <button class="button" type="button" onclick="window.history.length > 1 ? window.history.back() : window.location.assign('/')">Quay lại</button>
        <button class="button" type="button" onclick="window.location.reload()">Tải lại trang</button>
      </div>
    </section>
    <footer>Vận hành gọn. Đón khách trọn vẹn.</footer>
  </main>
</body>
</html>
